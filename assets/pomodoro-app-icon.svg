<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="dial" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#303747"/>
      <stop offset="0.62" stop-color="#1d2330"/>
      <stop offset="1" stop-color="#111722"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#394153"/>
      <stop offset="0.5" stop-color="#1b2230"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <linearGradient id="progress" x1="0.12" y1="0.88" x2="0.82" y2="0.14">
      <stop offset="0" stop-color="#ffd04b"/>
      <stop offset="0.35" stop-color="#ff9b27"/>
      <stop offset="0.68" stop-color="#ff5a21"/>
      <stop offset="1" stop-color="#ff3038"/>
    </linearGradient>
    <linearGradient id="inactive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72717a"/>
      <stop offset="1" stop-color="#41434c"/>
    </linearGradient>
    <radialGradient id="knob" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#fff9dd"/>
      <stop offset="1" stop-color="#ffe2a2"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <!-- Transparent outside the circular icon -->
  <circle cx="512" cy="512" r="474" fill="url(#rim)" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="451" fill="none" stroke="#50596c" stroke-width="3" opacity=".55"/>
  <circle cx="512" cy="512" r="350" fill="url(#dial)" stroke="#111722" stroke-width="12"/>

  <!-- Progress track -->
  <circle cx="512" cy="512" r="368" fill="none" stroke="#171d28" stroke-width="86"/>
  <!-- Inactive arc -->
  <path d="M 192.4 328 A 368 368 0 0 1 512 144"
        fill="none" stroke="url(#inactive)" stroke-width="76" stroke-linecap="round"/>
  <!-- Active arc -->
  <path d="M 192.4 696 A 368 368 0 1 0 512 144"
        fill="none" stroke="url(#progress)" stroke-width="76" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Knob -->
  <circle cx="512" cy="144" r="44" fill="#ff6435" opacity=".28" filter="url(#glow)"/>
  <circle cx="512" cy="144" r="39" fill="url(#knob)"/>

  <!-- Center number -->
  <text x="512" y="592" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="230" font-weight="700"
        fill="#fffaf1" filter="url(#textShadow)">25</text>
</svg>