# Builds the Windows portable exe and publishes it as a
# GitHub Release named after package.json's version.
#
# Owner-approved on the condition that it never costs money (OA-13 in
# docs/OWNER_ACTIONS.md). It fails closed: nothing builds unless the repo
# is verifiably public (standard runners are free there) and the approval
# hasn't expired. Beyond that it stays small:
# - Linux runners only; the Windows build runs under Wine in
#   electron-builder's own image.
# - Runs only when package.json or this file changes, or when started by
#   hand, and the build job is skipped outright when the release for the
#   current version already exists - bump "version" to release again.
# - Hard time limits, no workflow artifacts (those use billed storage;
#   release assets don't).
name: Release

on:
  push:
    branches: [stable]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - name: Fail closed unless the run is verifiably free
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          APPROVAL_EXPIRES: '2027-03-26'
        run: |
          if [ "$IS_PRIVATE" != "false" ]; then
            echo "::error::Repository is not verifiably public (private='$IS_PRIVATE'); Actions may not be free. Not building."
            exit 1
          fi
          if [ "$(date -u +%Y-%m-%d)" \> "$APPROVAL_EXPIRES" ]; then
            echo "::error::The owner's approval for this workflow expired on $APPROVAL_EXPIRES (OA-13). Renew it before releasing."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: electronuserland/builder:wine
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # The mounted default HOME (/github/home) isn't owned by the container's
      # root user, and wine refuses to create its prefix there.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npx electron-builder --win --x64 --publish never
      - name: Checksums
        working-directory: dist
        run: sha256sum "PomodoroTimer-Portable-$VERSION.exe" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Pomodoro Timer ${{ env.VERSION }}
          make_latest: true
          files: |
            dist/PomodoroTimer-Portable-${{ env.VERSION }}.exe
            dist/SHA256SUMS.txt
          body: |
            Windows 10/11 (64-bit)용 뽀모도로 타이머.

            - **PomodoroTimer-Portable-${{ env.VERSION }}.exe**: 설치 없이 바로 실행하는 포터블 버전. 원하는 폴더에 두고 실행하면 됩니다.
            - **SHA256SUMS.txt**: 다운로드 파일 확인용 체크섬.

            코드 서명이 없어 처음 실행할 때 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.
