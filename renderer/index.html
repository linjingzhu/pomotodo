<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Pomodoro Timer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="bg-image"></div>
    <div id="bg-tint"></div>
    <div class="titlebar-actions">
      <button id="close-btn" title="Close"></button>
      <button id="pin-btn" title="Lock window size" aria-pressed="false"></button>
      <button id="fullscreen-btn" title="Fullscreen"></button>
    </div>

    <main>
      <div id="timer-ring">
        <svg viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="52" />
        </svg>
        <div id="ring-glow"><div id="ring-fill"></div></div>
        <div id="timer-display">25:00</div>
      </div>
      <div id="controls">
        <button id="start-pause-btn" title="Start">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path id="play-icon" d="M4 2.5 L13 8 L4 13.5 Z" />
            <g id="pause-icon">
              <rect x="3" y="2" width="3.4" height="12" />
              <rect x="9.6" y="2" width="3.4" height="12" />
            </g>
          </svg>
        </button>
        <button id="reset-btn" title="Reset timer">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M8 2.5a5.5 5.5 0 1 1 -5.2 3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M2.3 2.5 L2.8 6.2 L6.2 5.2 Z" />
          </svg>
        </button>
      </div>
      <div id="goal-field">
        <button id="goal-check" role="checkbox" aria-checked="false" aria-label="Goal reached" title="Mark this goal as reached">
          <svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path d="M3.5 8.3 L6.6 11.2 L12.5 4.8" /></svg>
        </button>
        <input id="task-input" type="text" maxlength="120" placeholder="Goal for this session"
               title="Press Enter to add it to Goals. Pick a goal in the Goals tab to set it here. Saved with each focus session." />
      </div>
      <div id="stats">
        <div class="stat-row"><span>Total turns</span><span id="total-turns">0</span></div>
        <div class="stat-row"><span>Total study time</span><span id="total-study">0m</span></div>
        <button id="stats-reset-btn" title="Reset total turns and study time to 0">Reset Session</button>
      </div>
      <!-- anchored to main, so it rides just above the panel when that opens -->
      <div class="corner-actions bottom">
        <button id="gear-btn" title="Goals · Calendar · Settings"></button>
      </div>
    </main>

    <section id="settings-panel" class="hidden">
      <nav id="panel-tabs" role="tablist">
        <button role="tab" id="tab-btn-goals" data-tab="goals" aria-selected="true">Goals</button>
        <button role="tab" id="tab-btn-calendar" data-tab="calendar" aria-selected="false">Calendar</button>
        <button role="tab" id="tab-btn-settings" data-tab="settings" aria-selected="false">Settings</button>
      </nav>

      <div id="tab-goals" class="tab" role="tabpanel" aria-labelledby="tab-btn-goals">
        <form id="goal-form">
          <input id="goal-input" type="text" maxlength="200" placeholder="Add a goal" />
          <button type="submit" id="goal-add-btn">Add</button>
        </form>
        <p id="goals-empty" class="hint">Set a goal, then tick it off when you reach it. Reached goals also appear on that day in the Calendar tab.</p>
        <ul id="goal-list"></ul>
      </div>

      <div id="tab-calendar" class="tab hidden" role="tabpanel" aria-labelledby="tab-btn-calendar">
        <div id="cal-header">
          <button id="cal-prev" title="Previous month" aria-label="Previous month">&lsaquo;</button>
          <span id="cal-title"></span>
          <button id="cal-next" title="Next month" aria-label="Next month">&rsaquo;</button>
        </div>
        <div id="cal-grid"></div>
        <div id="cal-day">
          <div id="cal-day-title"></div>
          <ul id="cal-day-list"></ul>
          <p id="cal-day-empty" class="hint">No focus sessions on this day. Finished sessions are recorded automatically, with what you were working on.</p>
        </div>
      </div>

      <div id="tab-settings" class="tab hidden" role="tabpanel" aria-labelledby="tab-btn-settings">
      <div class="row">
        <label for="work-min">Work (min)</label>
        <input type="number" id="work-min" min="1" max="180" value="25" />
      </div>
      <div class="row">
        <label for="break-min">Break (min)</label>
        <input type="number" id="break-min" min="1" max="60" value="5" />
      </div>
      <div class="row">
        <label for="notify-on-phase-change">Windows notification when a session ends</label>
        <input type="checkbox" id="notify-on-phase-change" />
      </div>
      <div class="row">
        <label for="always-top">Always on top</label>
        <input type="checkbox" id="always-top" />
      </div>
      <div class="row">
        <label for="minimize-to-tray">Minimize to tray</label>
        <input type="checkbox" id="minimize-to-tray" />
      </div>
      <div class="row">
        <label for="close-to-tray">Close to tray (keeps running)</label>
        <input type="checkbox" id="close-to-tray" />
      </div>
      <hr />
      <div class="row">
        <label for="display-select">Monitor</label>
        <select id="display-select"></select>
      </div>
      <div class="row">
        <label>Snap to corner</label>
        <div id="corner-grid">
          <button data-corner="tl" title="Top left">↖</button>
          <button data-corner="tr" title="Top right">↗</button>
          <button data-corner="bl" title="Bottom left">↙</button>
          <button data-corner="br" title="Bottom right">↘</button>
        </div>
      </div>
      <hr />
      <div class="row">
        <label>Background image (fills the short side)</label>
        <div class="button-group">
          <button id="bg-pick-btn">Choose...</button>
          <button id="bg-clear-btn">Clear</button>
        </div>
      </div>
      <div class="row">
        <label for="bg-blur">Background blur</label>
        <input type="range" id="bg-blur" min="0" max="20" step="1" />
      </div>
      <div class="row">
        <label for="bg-tint-color">Tint color</label>
        <input type="color" id="bg-tint-color" />
      </div>
      <div class="row">
        <label for="bg-tint-opacity">Tint strength</label>
        <input type="range" id="bg-tint-opacity" min="0" max="100" step="5" />
      </div>
      <hr />
      <div class="row">
        <label for="accent-color">Key color (work; break is always turquoise)</label>
        <input type="color" id="accent-color" />
      </div>
      <div class="row">
        <label for="gauge-style">Gauge style</label>
        <select id="gauge-style">
          <option value="pie">Filled pie</option>
          <option value="stroke">Stroke</option>
        </select>
      </div>
      </div>
    </section>
  </div>

  <!-- Transparent windows get no native resize border, so these thin edge
       and corner strips resize the window instead (hidden while the size
       is locked or fullscreen). -->
  <div id="resize-handles" aria-hidden="true">
    <div data-edge="n"></div><div data-edge="s"></div>
    <div data-edge="e"></div><div data-edge="w"></div>
    <div data-edge="nw"></div><div data-edge="ne"></div>
    <div data-edge="sw"></div><div data-edge="se"></div>
  </div>

  <script src="renderer.js"></script>
  <script src="panel.js"></script>
</body>
</html>
