<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Pomodoro Timer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="bg-image"></div>
    <div id="bg-tint"></div>
    <div class="titlebar-actions">
      <button id="close-btn" title="Close"></button>
      <button id="gear-btn" title="Settings"></button>
      <button id="pin-btn" title="Lock window size" aria-pressed="false"></button>
      <button id="fullscreen-btn" title="Fullscreen"></button>
    </div>

    <main>
      <div id="timer-ring">
        <svg viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="52" />
        </svg>
        <div id="ring-glow"><div id="ring-fill"></div></div>
        <div id="timer-display">25:00</div>
      </div>
      <div id="controls">
        <button id="start-pause-btn" title="Start">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path id="play-icon" d="M4 2.5 L13 8 L4 13.5 Z" />
            <g id="pause-icon">
              <rect x="3" y="2" width="3.4" height="12" />
              <rect x="9.6" y="2" width="3.4" height="12" />
            </g>
          </svg>
        </button>
        <button id="reset-btn" title="Reset timer">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
            <path d="M8 2.5a5.5 5.5 0 1 1 -5.2 3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <path d="M2.3 2.5 L2.8 6.2 L6.2 5.2 Z" />
          </svg>
        </button>
      </div>
      <div id="stats">
        <div class="stat-row"><span>Total turns</span><span id="total-turns">0</span></div>
        <div class="stat-row"><span>Total study time</span><span id="total-study">0m</span></div>
        <button id="stats-reset-btn" title="Reset total turns and study time to 0">Reset</button>
      </div>
    </main>

    <section id="settings-panel" class="hidden">
      <div class="row">
        <label for="work-min">Work (min)</label>
        <input type="number" id="work-min" min="1" max="180" value="25" />
      </div>
      <div class="row">
        <label for="break-min">Break (min)</label>
        <input type="number" id="break-min" min="1" max="60" value="5" />
      </div>
      <div class="row">
        <label for="notify-on-phase-change">Windows notification when a session ends</label>
        <input type="checkbox" id="notify-on-phase-change" />
      </div>
      <div class="row">
        <label for="always-top">Always on top</label>
        <input type="checkbox" id="always-top" />
      </div>
      <div class="row">
        <label for="minimize-to-tray">Minimize to tray</label>
        <input type="checkbox" id="minimize-to-tray" />
      </div>
      <div class="row">
        <label for="close-to-tray">Close to tray (keeps running)</label>
        <input type="checkbox" id="close-to-tray" />
      </div>
      <hr />
      <div class="row">
        <label for="display-select">Monitor</label>
        <select id="display-select"></select>
      </div>
      <div class="row">
        <label>Snap to corner</label>
        <div id="corner-grid">
          <button data-corner="tl" title="Top left">↖</button>
          <button data-corner="tr" title="Top right">↗</button>
          <button data-corner="bl" title="Bottom left">↙</button>
          <button data-corner="br" title="Bottom right">↘</button>
        </div>
      </div>
      <hr />
      <div class="row">
        <label>Background image (fills the short side)</label>
        <div class="button-group">
          <button id="bg-pick-btn">Choose...</button>
          <button id="bg-clear-btn">Clear</button>
        </div>
      </div>
      <div class="row">
        <label for="bg-blur">Background blur</label>
        <input type="range" id="bg-blur" min="0" max="20" step="1" />
      </div>
      <div class="row">
        <label for="bg-tint-color">Tint color</label>
        <input type="color" id="bg-tint-color" />
      </div>
      <div class="row">
        <label for="bg-tint-opacity">Tint strength</label>
        <input type="range" id="bg-tint-opacity" min="0" max="100" step="5" />
      </div>
      <hr />
      <div class="row">
        <label for="accent-color">Key color (work; break is always turquoise)</label>
        <input type="color" id="accent-color" />
      </div>
      <div class="row">
        <label for="gauge-style">Gauge style</label>
        <select id="gauge-style">
          <option value="pie">Filled pie</option>
          <option value="stroke">Stroke</option>
        </select>
      </div>
    </section>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
