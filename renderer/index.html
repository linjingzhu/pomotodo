<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Pomodoro Timer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg-image"></div>
  <div id="bg-tint"></div>
  <div id="app">
    <header id="titlebar">
      <span id="mode-label">작업</span>
      <button id="gear-btn" title="설정">⚙</button>
    </header>

    <main>
      <div class="glass-card">
        <div id="timer-ring">
          <svg viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="52" />
            <circle id="ring-progress" cx="60" cy="60" r="52" />
          </svg>
          <div id="timer-display">25:00</div>
        </div>
        <div id="controls">
          <button id="start-pause-btn" class="primary">시작</button>
          <button id="reset-btn">초기화</button>
        </div>
      </div>
    </main>

    <section id="settings-panel" class="hidden">
      <div class="row">
        <label for="work-min">작업 시간 (분)</label>
        <input type="number" id="work-min" min="1" max="180" value="25" />
      </div>
      <div class="row">
        <label for="break-min">쉬는 시간 (분)</label>
        <input type="number" id="break-min" min="1" max="60" value="5" />
      </div>
      <div class="row">
        <label for="always-top">항상 위 (Always on Top: 다른 창 위에 항상 표시)</label>
        <input type="checkbox" id="always-top" />
      </div>
      <div class="row">
        <label for="minimize-to-tray">최소화 시 트레이로 보내기</label>
        <input type="checkbox" id="minimize-to-tray" />
      </div>
      <div class="row">
        <label for="close-to-tray">닫기(X) 시 트레이로 보내기 (종료 안 함)</label>
        <input type="checkbox" id="close-to-tray" />
      </div>
      <div class="row">
        <label for="fullscreen-btn">전체화면</label>
        <button id="fullscreen-btn">전체화면 전환</button>
      </div>
      <hr />
      <div class="row">
        <label for="display-select">모니터 선택</label>
        <select id="display-select"></select>
      </div>
      <div class="row">
        <label>모서리에 붙이기</label>
        <div id="corner-grid">
          <button data-corner="tl">↖ 좌상단</button>
          <button data-corner="tr">↗ 우상단</button>
          <button data-corner="bl">↙ 좌하단</button>
          <button data-corner="br">↘ 우하단</button>
        </div>
      </div>
      <hr />
      <div class="row">
        <label>배경 이미지 (짧은 쪽에 맞춰 채움)</label>
        <div class="button-group">
          <button id="bg-pick-btn">선택...</button>
          <button id="bg-clear-btn">지우기</button>
        </div>
      </div>
      <div class="row">
        <label for="bg-blur">배경 블러</label>
        <input type="range" id="bg-blur" min="0" max="20" step="1" />
      </div>
      <div class="row">
        <label for="bg-tint-color">배경 틴트 색상</label>
        <input type="color" id="bg-tint-color" />
      </div>
      <div class="row">
        <label for="bg-tint-opacity">틴트 강도</label>
        <input type="range" id="bg-tint-opacity" min="0" max="100" step="5" />
      </div>
      <hr />
      <div class="row">
        <label for="accent-color">키 컬러 (링 · 버튼)</label>
        <input type="color" id="accent-color" />
      </div>
    </section>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
