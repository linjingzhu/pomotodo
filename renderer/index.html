<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Pomodoro Timer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <span id="mode-label">작업</span>
      <button id="gear-btn" title="설정">⚙</button>
    </header>

    <main>
      <div id="timer-display">25:00</div>
      <div id="controls">
        <button id="start-pause-btn" class="primary">시작</button>
        <button id="reset-btn">초기화</button>
      </div>
    </main>

    <section id="settings-panel" class="hidden">
      <div class="row">
        <label for="work-min">작업 시간 (분)</label>
        <input type="number" id="work-min" min="1" max="180" value="25" />
      </div>
      <div class="row">
        <label for="break-min">쉬는 시간 (분)</label>
        <input type="number" id="break-min" min="1" max="60" value="5" />
      </div>
      <div class="row">
        <label for="always-top">항상 위 (Always on Top: 다른 창 위에 항상 표시)</label>
        <input type="checkbox" id="always-top" />
      </div>
      <div class="row">
        <label for="fullscreen-btn">전체화면</label>
        <button id="fullscreen-btn">전체화면 전환</button>
      </div>
      <hr />
      <div class="row">
        <label for="display-select">모니터 선택</label>
        <select id="display-select"></select>
      </div>
      <div class="row">
        <label>모서리에 붙이기</label>
        <div id="corner-grid">
          <button data-corner="tl">↖ 좌상단</button>
          <button data-corner="tr">↗ 우상단</button>
          <button data-corner="bl">↙ 좌하단</button>
          <button data-corner="br">↘ 우하단</button>
        </div>
      </div>
    </section>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
